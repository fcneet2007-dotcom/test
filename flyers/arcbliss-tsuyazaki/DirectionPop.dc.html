<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C8102E; text-decoration: none; }
    a:hover { color: #96001F; }
  </style>
</helmet>

<div style="width: 794px; height: 1123px; box-sizing: border-box; background: #FFFFFF; color: #222222; font-family: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', Meiryo, sans-serif; display: flex; flex-direction: column; padding: 34px; gap: 14px; overflow: hidden;">

  <div style="font-size: 13px; font-weight: 700; letter-spacing: 0.2em; color: #999999;">別案スケッチ ／ 折込チラシ型（赤×黄のポップ訴求）</div>

  <!-- banner -->
  <div style="background: #C8102E; color: #FFFFFF; padding: 20px 24px; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="background: #FFD400; color: #C8102E; font-size: 24px; font-weight: 900; padding: 6px 14px; white-space: nowrap;">9/19→9/23</div>
      <div style="font-size: 20px; font-weight: 700; white-space: nowrap;">の5日間だけ</div>
      <div style="background: #FFFFFF; color: #C8102E; font-size: 20px; font-weight: 900; padding: 5px 12px; white-space: nowrap;">残り4戸</div>
    </div>
    <div style="font-size: 76px; font-weight: 900; line-height: 1.02; white-space: nowrap;">決めた人、<span style="color: #FFD400;">得する。</span></div>
    <div style="font-size: 22px; font-weight: 700;">圓能寺から豪華プレゼント進呈</div>
  </div>

  <!-- big photo placeholder -->
  <div style="height: 300px; background: #EDEDED; border: 3px dashed #C9C9C9; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700; color: #9A9A9A;">外観写真を全面で使う／空室表は下に大きく</div>

  <!-- price slab -->
  <div style="display: flex; gap: 12px;">
    <div style="flex-grow: 1; background: #FFD400; padding: 18px 20px; display: flex; align-items: baseline; gap: 10px;">
      <span style="font-size: 20px; font-weight: 900;">賃料</span>
      <span style="font-size: 56px; font-weight: 900; line-height: 1;">69,000</span>
      <span style="font-size: 24px; font-weight: 900;">円</span>
    </div>
    <div style="width: 240px; border: 3px solid #222222; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 900;">敷金0・礼金0</div>
  </div>

  <!-- spec grid placeholder -->
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
    <div style="height: 62px; background: #F4F4F4; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #777777;">間取り図</div>
    <div style="height: 62px; background: #F4F4F4; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #777777;">設備アイコン</div>
    <div style="height: 62px; background: #F4F4F4; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: #777777;">地図・アクセス</div>
  </div>

  <div style="font-size: 16px; font-weight: 500; color: #555555; line-height: 1.7;">ねらい：スーパーの折込チラシに近い強度。遠目の視認性はこちらが上で、来店誘導には効きやすい一方、新築物件の質感や「豪華」の高級感は本案（Main）のほうが出ます。ターゲットが価格重視の層ならこちら、物件の見栄え重視なら本案。</div>

  <div style="margin-top: auto; background: #222222; color: #FFFFFF; padding: 18px 22px; display: flex; align-items: center; justify-content: space-between;">
    <div style="font-size: 20px; font-weight: 900;">エイブル新宮店 ／ 担当・圓能寺</div>
    <div style="font-size: 34px; font-weight: 900;">092-605-8126</div>
  </div>

</div>
</x-dc>

</html>
